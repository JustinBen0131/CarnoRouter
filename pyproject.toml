[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carno-router"
version = "0.3.0"
description = "Risk-controlled routing and research-agent evaluation laboratory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Justin Bennett"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
carno-router = "carno_router.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
